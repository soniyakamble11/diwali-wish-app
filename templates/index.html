<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Diwali Wishes from Soniya ✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Initial Screen - Firecracker */
    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at center, #1a0a00, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .intro-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .rocket-container {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .rocket {
      position: absolute;
      font-size: 100px;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 20px #ff6b00);
      animation: launchRocket 2.5s ease-out forwards;
    }

    @keyframes launchRocket {
      0% {
        bottom: -50px;
        transform: translateX(-50%) rotate(0deg) scale(1);
        filter: drop-shadow(0 0 20px #ff6b00);
      }
      30% {
        bottom: 20%;
        transform: translateX(-50%) rotate(-10deg) scale(1.1);
      }
      60% {
        bottom: 50%;
        transform: translateX(-50%) rotate(10deg) scale(1.2);
      }
      80% {
        bottom: 80%;
        transform: translateX(-50%) rotate(0deg) scale(1.5);
        filter: drop-shadow(0 0 40px #ff6b00);
      }
      100% {
        bottom: 90%;
        transform: translateX(-50%) rotate(0deg) scale(2);
        opacity: 0;
        filter: drop-shadow(0 0 60px #ff6b00);
      }
    }

    /* Massive Explosion */
    .explosion-overlay {
      position: fixed;
      inset: 0;
      z-index: 99;
      opacity: 0;
      pointer-events: none;
    }

    .explosion-overlay.active {
      animation: flashExplosion 1s ease-out;
    }

    @keyframes flashExplosion {
      0% {
        opacity: 0;
        background: radial-gradient(circle at center, transparent, transparent);
      }
      10% {
        opacity: 1;
        background: radial-gradient(circle at center, #fff, #fbbf24, #f59e0b, transparent 60%);
      }
      30% {
        opacity: 0.8;
        background: radial-gradient(circle at center, #fbbf24, #f59e0b, #ff6b00, transparent 70%);
      }
      100% {
        opacity: 0;
        background: radial-gradient(circle at center, transparent, transparent);
      }
    }

    /* Main Content Reveal */
    .main-content {
  position: fixed;
  inset: 0;
  z-index: 3;
  opacity: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(139, 69, 19, 0.2), transparent 70%),
              linear-gradient(180deg, rgba(26, 10, 0, 0.4) 0%, rgba(45, 24, 16, 0.4) 50%, rgba(26, 10, 0, 0.4) 100%);
  /* Made backgrounds more transparent - changed 0.3 to 0.2, and added 0.4 alpha to gradients */
}

    .main-content.show {
      animation: revealMain 1.5s ease-out 2.8s forwards;
    }

    @keyframes revealMain {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

     
    /* Happy Diwali Text */
    .happy-diwali {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #a0094d 0%, #8f1043 25%, #ffa500 50%, #ff8c00 75%, #ffd700 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 30px;
      opacity: 0;
      animation: titleReveal 1.2s ease-out 3.8s forwards, goldShine 3s ease-in-out 5s infinite;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        transform: scale(0.5) rotateX(-90deg);
      }
      60% {
        transform: scale(1.1) rotateX(10deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotateX(0deg);
      }
    }

    @keyframes goldShine {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    /* Decorative Stars */
    .star-burst {
      position: absolute;
      font-size: 40px;
      opacity: 0;
      animation: starBurst 1s ease-out forwards;
    }

    @keyframes starBurst {
      0% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.8;
        transform: scale(1) rotate(360deg);
      }
    }

    .star-burst:nth-child(1) { top: -40px; left: -60px; animation-delay: 4s; }
    .star-burst:nth-child(2) { top: -40px; right: -60px; animation-delay: 4.2s; }
    .star-burst:nth-child(3) { bottom: -40px; left: -60px; animation-delay: 4.4s; }
    .star-burst:nth-child(4) { bottom: -40px; right: -60px; animation-delay: 4.6s; }

    /* Message */
    .message {
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.8rem);
      color: #c0ae95;
      text-align: center;
      max-width: 800px;
      padding: 0 20px;
      margin-bottom: 50px;
      opacity: 0;
      animation: messageSlide 1s ease-out 4.5s forwards;
      line-height: 1.6;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .bg-image {
  position: fixed;
  inset: 0;
  z-index: 3;
  opacity: 0;
  background-image: url("{{ url_for('static', filename='images/bg.jpg') }}");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.bg-image.show {
  animation: bgFadeIn 2s ease-out 4s forwards;
}

@keyframes bgFadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 0.4;
  }
}

    /* Soniya Signature */
    .signature-container {
      position: relative;
      padding: 40px 80px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 140, 0, 0.1));
      border: 3px solid transparent;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      opacity: 0;
      animation: signatureReveal 1.2s ease-out 5s forwards;
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.3), inset 0 0 40px rgba(255, 215, 0, 0.1);
    }

    @keyframes signatureReveal {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      60% {
        transform: translateY(-10px) scale(1.05);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .signature-container::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, #ffd700, #ffa500, #ff8c00, #ffd700);
      background-size: 300% 300%;
      border-radius: 20px;
      z-index: -1;
      animation: borderGlow 3s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .from-text {
      font-size: 1.2rem;
      color: #ffd700;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeInText 0.8s ease-out 5.5s forwards;
    }

    .soniya-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, #7d7c7c 0%, #d85959 25%, #ffed4e 50%, #ffd700 75%, #fff 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: nameShine 2s ease-in-out 5.5s infinite, namePulse 2s ease-in-out 5.5s infinite;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
      letter-spacing: 0.1em;
      position: relative;
      opacity: 0;
      animation: fadeInText 0.8s ease-out 5.5s forwards, nameShine 2s ease-in-out 6.3s infinite;
    }

    @keyframes nameShine {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes namePulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart-icons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
      font-size: 2rem;
      opacity: 0;
      animation: fadeInText 0.8s ease-out 6s forwards;
    }

    .heart-icons span {
      animation: heartBeat 1.5s ease-in-out infinite;
    }

    .heart-icons span:nth-child(2) {
      animation-delay: 0.3s;
      font-size: 2.5rem;
    }

    .heart-icons span:nth-child(3) {
      animation-delay: 0.6s;
    }

    @keyframes heartBeat {
      0%, 100% {
        transform: scale(1);
      }
      25% {
        transform: scale(1.2);
      }
      50% {
        transform: scale(1);
      }
    }

    /* Floating Sparkles */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
    }

    .sparkle.active {
      animation: sparkleFloat 4s ease-in-out infinite;
    }

    @keyframes sparkleFloat {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Decorative Mandala */
    .mandala {
      position: fixed;
      bottom: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      opacity: 0.15;
      z-index: 5;
      animation: mandalaRotate 60s linear infinite;
    }

    @keyframes mandalaRotate {
      from {
        transform: translateX(-50%) rotate(0deg);
      }
      to {
        transform: translateX(-50%) rotate(360deg);
      }
    }
  </style>
</head>
<body>
    <audio autoplay loop>
        <source src="{{ url_for('static', filename='music/diwali.mp3') }}" type="audio/mpeg">
    </audio>
  
  <!-- Fireworks Canvas -->
  <canvas id="fireworksCanvas"></canvas>

   <!-- Background Image -->
<div class="bg-image" id="bgImage"></div>

  <!-- Mandala Background -->
  <div class="mandala">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="mandalaPattern" x="0" y="0" width="100%" height="100%">
          <circle cx="100" cy="100" r="90" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3"/>
          <circle cx="100" cy="100" r="70" fill="none" stroke="#ffa500" stroke-width="1" opacity="0.3"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3"/>
          <path d="M100,10 L110,90 L100,10 L90,90" stroke="#ffa500" stroke-width="1" opacity="0.3" transform="rotate(0 100 100)"/>
          <path d="M100,10 L110,90 L100,10 L90,90" stroke="#ffa500" stroke-width="1" opacity="0.3" transform="rotate(45 100 100)"/>
          <path d="M100,10 L110,90 L100,10 L90,90" stroke="#ffa500" stroke-width="1" opacity="0.3" transform="rotate(90 100 100)"/>
          <path d="M100,10 L110,90 L100,10 L90,90" stroke="#ffa500" stroke-width="1" opacity="0.3" transform="rotate(135 100 100)"/>
        </pattern>
      </defs>
      <rect width="200" height="200" fill="url(#mandalaPattern)"/>
    </svg>
  </div>

  <!-- Floating Sparkles -->
  <div id="sparklesContainer"></div>

  <!-- Intro Screen with Rocket -->
  <div class="intro-screen" id="introScreen">
    <div class="rocket-container">
      <div class="rocket">🎆</div>
    </div>
  </div>

  <!-- Explosion Overlay -->
  <div class="explosion-overlay" id="explosionOverlay"></div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    
   

    <!-- Happy Diwali Title -->
    <div style="position: relative;">
      <h1 class="happy-diwali">Happy Diwali</h1>
      <div class="star-burst">✨</div>
      <div class="star-burst">⭐</div>
      <div class="star-burst">✨</div>
      <div class="star-burst">⭐</div>
    </div>
   

    <!-- Message -->
    <p class="message">
      May this festival of lights bring you endless joy, prosperity, and success.<br>
      Wishing you a luminous and blessed Diwali filled with love and laughter!
    </p>

    <!-- Signature Section -->
    <div class="signature-container">
      <div class="from-text">~ WITH LOVE FROM ~</div>
      <div class="soniya-name">Soniya</div>
      <div class="heart-icons">
        <span>🪔</span>
      </div>
    </div>

  </div>

  <script>
    // Timeline Control
    setTimeout(() => {
      document.getElementById('explosionOverlay').classList.add('active');
    }, 2500);

    setTimeout(() => {
      document.getElementById('introScreen').classList.add('fade-out');
      document.getElementById('mainContent').classList.add('show');
    }, 2800);

    // Fireworks Canvas
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.velocity = {
          x: (Math.random() - 0.5) * 12,
          y: (Math.random() - 0.5) * 12
        };
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
        this.size = Math.random() * 4 + 2;
      }

      update() {
        this.velocity.y += 0.15;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Glow effect
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
        gradient.addColorStop(0, this.color);
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Firework {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.particles = [];
        const colors = ['#ffd700', '#ffed4e', '#ffa500', '#ff8c00', '#fff', '#ffb347'];
        const particleCount = 80;
        
        for (let i = 0; i < particleCount; i++) {
          this.particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
        }
      }

      update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.alpha > 0);
      }

      draw() {
        this.particles.forEach(p => p.draw());
      }

      isDead() {
        return this.particles.length === 0;
      }
    }

    let fireworks = [];

    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      fireworks.forEach((fw, index) => {
        fw.update();
        fw.draw();
        if (fw.isDead()) {
          fireworks.splice(index, 1);
        }
      });

      requestAnimationFrame(animate);
    }

    // Start fireworks after explosion
    setTimeout(() => {
      setInterval(() => {
        if (Math.random() > 0.4) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * (canvas.height * 0.6);
          fireworks.push(new Firework(x, y));
        }
      }, 600);
    }, 3000);

    animate();
    // Show background image after message appears
setTimeout(() => {
  document.getElementById('bgImage').classList.add('show');
}, 4000);

    // Floating Sparkles
    const sparklesContainer = document.getElementById('sparklesContainer');
    const sparkleSymbols = ['✨', '⭐', '💫', '🌟'];
    
    function createSparkle() {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.textContent = sparkleSymbols[Math.floor(Math.random() * sparkleSymbols.length)];
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.bottom = '-50px';
      sparkle.style.fontSize = (Math.random() * 20 + 20) + 'px';
      sparkle.style.animationDuration = (Math.random() * 3 + 4) + 's';
      sparkle.style.animationDelay = Math.random() * 2 + 's';
      sparklesContainer.appendChild(sparkle);
      
      setTimeout(() => sparkle.classList.add('active'), 50);
      
      setTimeout(() => {
        sparkle.remove();
      }, 8000);
    }

    setTimeout(() => {
      setInterval(createSparkle, 800);
    }, 4000);

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
